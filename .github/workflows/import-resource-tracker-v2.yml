name: Import Resource Tracker V2

on:
  push:
    branches:
      - redesign/resource-tracker-v2

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/resource-tracker-v2
          fetch-depth: 0
      - name: Restore reviewed V1 files
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/rtv2part*.txt | base64 -d > /tmp/rtv2-files.tgz
          tar -xzf /tmp/rtv2-files.tgz -C .
          rm -rf .tmp
          rm -f .github/workflows/import-resource-tracker-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resource Tracker V1 redesign"
          git push origin HEAD:redesign/resource-tracker-v2
