# Temporary preview deploy: run from main, but build the reviewed redesign branch.
# The site is public: anyone with the URL can open it. The data is protected only by the database rules (no login yet).
name: Deploy Resource Tracker to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/resource-tracker-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          RT_BACKEND: ${{ vars.RT_BACKEND }}
          RT_SUPABASE_URL: ${{ vars.RT_SUPABASE_URL }}
          RT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.RT_SUPABASE_PUBLISHABLE_KEY }}
          RT_REQUIRE_LIVE: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
